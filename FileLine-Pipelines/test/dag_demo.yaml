# ═══════════════════════════════════════════════════════════════
# Complex DAG — 三重分支 + 多输出 + 多级汇合 + 多图
# ═══════════════════════════════════════════════════════════════
#
#                            ┌─ x2 ──→ branch_a ────────────────────────────────┐
#                            │                                                  │
#  input_data.csv ───────────┤                                                  │
#                            │                              ┌── csv_concat ──→ merged ──→ chart.pdf
#                            ├─ named_split(cat) ─┬─ A ─→ x10 ──→ result_a ────┤
#                                                  ├─ B ─→ x100 ─→ result_b ────┤
#                                                  ├─ C ─→ x1 ───→ result_c ────┤
#                                                  └─ D ─→ x50 ─→ result_d ────┘
#
#                            └─ named_split(group) ─┬─ X ─→ x5 ──→ group_x ──→ csv_concat ──→ grouped_merge ──→ chart2.pdf
#                                                    └─ Y ─→ x20 ─→ group_y ──┘
#
#  步骤: 9 步, 6 路并行, 2 次汇合
# ═══════════════════════════════════════════════════════════════

initial_load:
  include:
    - path: "FileLine-Pipelines/test/input_*.csv"
      tags: [raw]
  type: raw
  global_tags: [DAG_COMPLEX]

steps:
  # ─── 基线分支 ───
  - processor: csv_multiplier
    inputs: initial
    output: branch_a
    params:
      multiplier: 2

  # ─── 命名拆分: 按 cat (4 组) ───
  - processor: test_named_split
    inputs: initial
    outputs:
      A: path_a
      B: path_b
      C: path_c
      D: path_d

  # ─── 各 cat 分支独立参数 ───
  - processor: csv_multiplier
    inputs: path_a
    output: result_a
    params:
      multiplier: 10

  - processor: csv_multiplier
    inputs: path_b
    output: result_b
    params:
      multiplier: 100

  - processor: csv_multiplier
    inputs: path_c
    output: result_c
    params:
      multiplier: 1

  - processor: csv_multiplier
    inputs: path_d
    output: result_d
    params:
      multiplier: 50

  # ─── 第一次汇合 ───
  - processor: csv_concat
    inputs: [branch_a, result_a, result_b, result_c, result_d]
    output: merged

  # ─── 第二重拆分: 按 group (X/Y) ───
  - processor: test_named_split
    inputs: merged
    outputs:
      X: group_x
      Y: group_y
    params:
      split_col: group

  # ─── 第二重各分支 ───
  - processor: csv_multiplier
    inputs: group_x
    output: result_x
    params:
      multiplier: 5

  - processor: csv_multiplier
    inputs: group_y
    output: result_y
    params:
      multiplier: 20

  # ─── 第二次汇合 ───
  - processor: csv_concat
    inputs: [result_x, result_y]
    output: grouped_merge

  # ─── 双图输出 ───
  - processor: plot_grouped_bar
    inputs: merged
    output: chart_total
    params:
      main_group_col: cat
      sub_group_col: group
      value_col: value
      title: "Total Merge"
    export: total_chart.pdf

  - processor: plot_grouped_bar
    inputs: grouped_merge
    output: chart_grouped
    params:
      main_group_col: cat
      sub_group_col: group
      value_col: value
      title: "Grouped Merge"
    export: grouped_chart.pdf

final_output:
  - name: merged
    export: final_merged.csv
  - name: grouped_merge
    export: final_grouped.csv
  - name: chart_total
  - name: chart_grouped
