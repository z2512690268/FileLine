name: colorblind_safe
description: Colorblind-friendly palette for multi-series outputs.
variables:
  PRIMARY_COLOR:
    type: color
    value: "#0072b2"
    description: Main series color.
  SECONDARY_COLOR:
    type: color
    value: "#d55e00"
    description: Comparison series color.
  ACCENT_COLOR:
    type: color
    value: "#009e73"
    description: Highlight or third series color.
  GRID_ALPHA:
    type: number
    value: 0.22
    description: Grid transparency for plot processors that expose it.
  FIG_DPI:
    type: number
    value: 300
    description: Export resolution.
  FIG_SIZE:
    type: tuple
    value: [7, 4]
    description: Matplotlib figsize as [width, height].
  LINE_COLORS:
    type: mapping
    value:
      A: "#0072b2"
      B: "#d55e00"
    description: Colors for grouped line plots.
  Y_LIMIT:
    type: range
    value: [0, 1]
    description: Y axis range for normalized metrics.
  FONT_FAMILY:
    type: string
    value: DejaVu Sans
    description: Global font family.
  BASE_FONT_SIZE:
    type: number
    value: 12
    description: Base axis label font size.
  LINE_WIDTH:
    type: number
    value: 2
    description: Line width for plot processors that expose it.
  MARKER_STYLE:
    type: string
    value: o
    description: Marker style for processors that expose it.
  LEGEND_LOC:
    type: string
    value: best
    description: Legend location.
