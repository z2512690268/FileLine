initial_load:
  include: 
    - path: "/root/keyao/Checkpoints/ZeroCkpt/ZeroCkpt2/scripts/data/time_expr/*.log"  # 使用*和**匹配子目录
  type: raw
  global_tags: [origin]

steps:
  - processor: parse_multi_stalltime
    inputs: initial
    output: parsed

  - processor: plot_grouped_bar
    inputs: parsed
    output: stalltime
    params:
      main_group_col: "model_name"
      sub_group_col: "ckpt_type"
      value_col: "full_time"
      title: "Full Stall Time"
      xlabel: "ModelName"
      ylabel: "Stall Time (s)"
      grid: False
      ylim: [0, 1.5]
      yticks_num: 5

final_output: 
  - name: stalltime
    export: stalltime.pdf