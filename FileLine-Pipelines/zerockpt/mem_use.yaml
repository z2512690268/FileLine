initial_load:
  include: 
    - path: "/root/keyao/Checkpoints/ZeroCkpt/expr_manager/Llama-grad-300-100-1-512-True.log.mem"  # 使用*和**匹配子目录
    - path: "/root/keyao/Checkpoints/ZeroCkpt/expr_manager/Llama-grad-300-100-1-512-True.log"  # 使用*和**匹配子目录
  type: raw
  global_tags: [origin]

steps:
  - processor: parse_mem
    inputs: initial
    output: parsed
    params:
      time_from_start: True

  - processor: plot_line
    inputs: parsed
    output: plot_mem
    params:
      time_col: time_from_start
      value_col: mem_usage
      title: "Memory Usage"
      xlabel: "Time (s)"
      ylabel: "Memory Usage (%)"

final_output:
  - name: plot_mem
    export: plot_mem.pdf