name: Standard dual-axis line chart
description: Plot two metrics with different scales against the same x-axis.
initial_load:
  include:
  - path: '*'
    source: initial
    tags:
    - studio_input
  type: raw
  global_tags:
  - studio
  - standard_template
steps:
- processor: plot_dual_axis_line
  inputs: initial
  output: dual_axis_figure
  params:
    time_col: x
    value_cols_y1:
    - metric_primary
    value_cols_y2:
    - metric_secondary
    title: Dual-Axis Line Chart
    xlabel: X
    ylabel_y1: Primary metric
    ylabel_y2: Secondary metric
    figsize:
    - 7
    - 4
    grid: true
    dpi: 300
final_output:
- name: dual_axis_figure
  export: dual_axis_figure.pdf
